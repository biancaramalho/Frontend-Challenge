<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Social links profile</title>

  <!-- 
  Theme Name: Conheça-me, estranho
  Theme URI: https://github.com/biancaramalho
  Author: Bianca Ramalho
  Author URI: https://github.com/biancaramalho
  Description: Um tema responsivo para suas redes sociais.
  Version: 1.0
  License: GNU General Public License v2 or later
  License URI: https://www.gnu.org/licenses/gpl-2.0.html
  -->

</head>
<body>
  <section class="profile-card">
    <!-- Header com imagem e textos-->
    <header>
      <img src="./assets/images/avatar-jessica.jpeg" alt="avatar-jessica" class="profile-pic">
      <h1>Jessica Randall</h1>
      <p class="location">London, United Kigdom</p>
      <quote class="bio">"Front-end developer and avid reader."</quote>
    </header>
    <!-- navegação com os botões-->
    <nav>
      <a href="#" class="btn highlight">GitHub</a>
      <a href="#" class="btn">Frontend Mentor</a>
      <a href="#" class="btn">LinkedIn</a>
      <a href="#" class="btn">Twitter</a>
      <a href="#" class="btn">Instagram</a>
    </nav>
  </section>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Bianca Ramalho | Devlin Project</a>.
  </footer>
</body>
</html>
